name: PR pipeline (Amplify replica)

# Replicates the build phases of `amplify.yml` as a pull-request check.
#
# amplify.yml mapping:
#   backend.build  -> "Validate Amplify backend" (typecheck instead of deploy)
#   frontend.build -> "Build frontend"
#
# `npx ampx pipeline-deploy` is intentionally NOT run here: it provisions AWS
# resources and requires AWS credentials + an Amplify App ID. Validation of the
# backend is done with a compile-only typecheck (tsc --noEmit) so PRs fail fast
# on backend errors without touching AWS. Deployment still happens via Amplify
# Hosting when the branch is merged.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---- amplify.yml: backend.build & frontend.preBuild ----
      - name: Install dependencies (npm ci --legacy-peer-deps)
        run: npm ci --legacy-peer-deps

      # ---- amplify.yml: backend.build (`npx ampx pipeline-deploy`) ----
      # Validation-only equivalent: compile the Amplify backend definition.
      - name: Validate Amplify backend
        run: npm run typecheck:backend

      # ---- amplify.yml: frontend.build (`npm run build`) ----
      - name: Build frontend
        run: npm run build

      # ---- amplify.yml: frontend.artifacts (baseDirectory: dist) ----
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
